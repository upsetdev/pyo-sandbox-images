name: Image

# One image, published for both architectures (release.yml calls it).
# Each architecture builds on a runner of its own (no QEMU), passes
# scripts/smoke.sh, then goes to ghcr.io by digest. The last job joins
# them into one multi-arch image with the given tags, signs it with
# cosign keyless (as this workflow) and checks anyone can pull it.
on:
  workflow_call:
    inputs:
      image:
        description: base or desktop
        type: string
        required: true
      tags:
        description: Its tags, space separated
        type: string
        required: true
      base:
        description: The base image desktop is built on, pinned by digest
        type: string
        default: ""
    outputs:
      digest:
        description: The multi-arch image's digest
        value: ${{ jobs.publish.outputs.digest }}

env:
  REPO: ghcr.io/upsetdev/pyo-sandbox-images/${{ inputs.image }}

jobs:
  build:
    name: Build ${{ inputs.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ inputs.image }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ inputs.base && format('BASE={0}', inputs.base) || '' }}
          load: true
          provenance: false
          tags: pyo-sandbox/${{ inputs.image }}:test
      - name: Smoke test
        run: scripts/smoke.sh "${{ inputs.image }}" "pyo-sandbox/${{ inputs.image }}:test"
      # The same build again, from the builder's cache, pushed by digest.
      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ inputs.image }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ inputs.base && format('BASE={0}', inputs.base) || '' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REPO }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ inputs.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ inputs.image }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # Signing: proves the image came from this workflow.
    outputs:
      digest: ${{ steps.join.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ inputs.image }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Join both architectures
        id: join
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          tags=()
          for t in $TAGS; do tags+=(-t "$REPO:$t"); done
          sources=()
          for d in digests/*; do sources+=("$REPO@sha256:$(basename "$d")"); done
          [ "${#sources[@]}" = 2 ] || { echo "::error::expected 2 architectures, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          first=${TAGS%% *}
          digest=$(docker buildx imagetools inspect "$REPO:$first" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "$REPO@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign
        env:
          DIGEST: ${{ steps.join.outputs.digest }}
        run: cosign sign --yes "$REPO@$DIGEST"
      # Pyo pulls without logging in. A new package on ghcr.io may start
      # private: make it public in its package settings, then run the job
      # again.
      - name: Anyone can pull it
        env:
          DIGEST: ${{ steps.join.outputs.digest }}
        run: |
          path=${REPO#ghcr.io/}
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$path:pull" | jq -r .token)
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/$path/manifests/$DIGEST")
          if [ "$code" != 200 ]; then
            echo "::error::$REPO can't be pulled without logging in (HTTP $code). Make the package public in its settings on GitHub, then run this job again."
            exit 1
          fi
