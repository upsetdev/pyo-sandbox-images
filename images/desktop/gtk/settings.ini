# GTK 3 for the desktop's apps: the Pyo theme (gtk.css, Adwaita's dark
# variant with Pyo's colors), Pyo's icons and Inter. The browser keeps
# plain Adwaita (GTK_THEME in /usr/local/bin/browser), so web pages keep
# their light colors.
[Settings]
gtk-theme-name=Pyo
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Pyo
gtk-cursor-theme-name=Adwaita
gtk-font-name=Inter Variable 10
gtk-enable-animations=false
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
