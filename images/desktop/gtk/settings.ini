# GTK 3 for the desktop's apps: Adwaita in its dark variant, Pyo's icons
# and Inter. The browser keeps Adwaita's light one (GTK_THEME in
# /usr/local/bin/browser), so web pages keep their light colors.
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Pyo
gtk-cursor-theme-name=Adwaita
gtk-font-name=Inter Variable 10
gtk-enable-animations=false
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
