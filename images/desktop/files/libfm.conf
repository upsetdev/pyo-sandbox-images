# libfm's defaults (/etc/xdg/libfm/libfm.conf), for PCManFM: double
# click to open, no trash (the sandbox has none), the desktop's
# terminal, and icon sizes that suit a 1280x800 screen.
[config]
single_click=0
use_trash=0
confirm_del=1
terminal=xfce4-terminal %s
thumbnail_local=1
thumbnail_max=2048

[ui]
big_icon_size=48
small_icon_size=16
thumbnail_size=128
pane_icon_size=16
show_thumbnail=1

[places]
places_home=1
places_desktop=0
places_root=1
places_computer=0
places_trash=0
places_applications=0
places_network=0
places_unmounted=0
