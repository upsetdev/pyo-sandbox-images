# PCManFM's defaults (/etc/xdg/pcmanfm/default/pcmanfm.conf): a window
# that fits the screen, places in the side pane, icons, and only the
# navigation buttons in the toolbar. No status bar. Nothing to mount.
[config]
bm_open_method=0

[volume]
mount_on_startup=0
mount_removable=0
autorun=0

[ui]
win_width=880
win_height=540
splitter_pos=190
side_pane_mode=places
view_mode=icon
show_hidden=0
show_statusbar=0
toolbar=navigation;home;
pathbar_mode_buttons=0
always_show_tabs=0
max_tab_chars=32
sort=name;ascending;
